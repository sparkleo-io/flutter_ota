name: flutter_ota
description: Ship firmware without a cable — OTA updates for ESP32-class BLE devices (ESP-IDF/Arduino). MQTT and Wi-Fi HTTP/HTTPS support are planned.
version: 1.0.0
homepage: https://github.com/sparkleo-io/flutter_ota
repository: https://github.com/sparkleo-io/flutter_ota
issue_tracker: https://github.com/sparkleo-io/flutter_ota/issues
topics:
  - bluetooth
  - ble
  - ota
  - iot
  - esp32
screenshots:
  - description: Example home screen to start BLE scanning for ESP32 OTA targets.
    path: screenshots/home_screen.jpeg
  - description: Example BLE device scan screen showing nearby ESP32 targets for OTA.
    path: screenshots/scanning_screen.jpeg
  - description: Example OTA transfer progress with firmware size and integrity checks.
    path: screenshots/progress_screen.jpeg
  - description: Example OTA session logs screen with captured package log lines.
    path: screenshots/logging_screen.jpeg

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  flutter_blue_plus: ^2.3.8
  file_picker: ^11.0.2
  http: ^1.2.0
  logger: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
